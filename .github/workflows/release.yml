name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, default: current version without -SNAPSHOT'
        required: false

# clear all permissions for GITHUB_TOKEN
permissions: { }

jobs:
  release:
    runs-on: ubuntu-26.04

    permissions:
      # push release commits and tag
      contents: write
      # GitHub OIDC token exchanged by atr-maven-plugin for an ATR JWT (Trusted Publishing)
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release:prepare pushes release commits and tag
          persist-credentials: true

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release with Maven
        env:
          VERSION: ${{ inputs.version }}
          # also used by Maven builds forked by release plugin
          # split local repository - installed artifacts go to a temporary directory
          MAVEN_ARGS: >-
            -ntp
            -Daether.enhancedLocalRepository.split=true
            -Daether.enhancedLocalRepository.localPrefix=${{ runner.temp }}/installed
        run: mvn release:prepare release:perform -e -B -V -DreleaseVersion="$VERSION"

      # https://github.com/apache/tooling-actions/tree/main/upload-to-atr
      - name: Upload to ATR
        uses: apache/tooling-actions/upload-to-atr@<COMMIT_HASH>
        with:
          version: ${{ inputs.version }}
          project: TODO extract project id from .asf.yaml?
          src: target/checkout/target/TBD (need to create a directory to consolidate everything that should be uploaded: source-release, sboms, njord bundle, or anything else?)
