name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, default: current version without -SNAPSHOT'
        required: false

# clear all permissions for GITHUB_TOKEN
permissions: { }

jobs:
  release:
    runs-on: ubuntu-26.04

    permissions:
      # push release commits and tag
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release:prepare pushes release commits and tag
          persist-credentials: true

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release with Maven
        env:
          VERSION: ${{ inputs.version }}
          # also used by Maven builds forked by release plugin
          # split local repository - installed artifacts go to a temporary directory
          MAVEN_ARGS: >-
            -Daether.enhancedLocalRepository.split=true
            -Daether.enhancedLocalRepository.localPrefix=${{ runner.temp }}/installed
        # push-to-atr profile from org.apache:apache parent
        run: mvn release:prepare release:perform -e -B -V -Ppush-to-atr -DreleaseVersion="$VERSION"
